{% extends "base.html" %}
{% load static %}

{% block title %}Create Policy — PDO GUI{% endblock %}

{% block content %}
<h1 class="page-title">Create Policy</h1>

<div class="card card-narrow">
    {% if error %}
        <div class="alert alert-error">{{ error }}</div>
    {% endif %}

    <form id="policy-create-form" method="post">
        {% csrf_token %}

        <div class="form-group">
            <label for="act_as">Act As</label>
            <select name="act_as" id="act_as" required>
                <option value="">— select user —</option>
                {% for user in users %}
                    <option value="{{ user.pk }}">{{ user.name }}</option>
                {% endfor %}
            </select>
        </div>

        <div class="form-group">
            <label for="name">Name</label>
            <input type="text" name="name" id="name" required
                   placeholder="e.g. simple_download"
                   pattern="[a-zA-Z0-9_]+" title="Letters, digits, and underscores only">
        </div>

        <div class="form-group">
            <label for="description">Description</label>
            <textarea name="description" id="description" required rows="3"
                      placeholder="Describe this policy…"></textarea>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label for="guardian_url">Guardian URL / Host</label>
                <input type="text" name="guardian_url" id="guardian_url" required
                       placeholder="e.g. localhost">
            </div>
            <div class="form-group">
                <label for="guardian_port">Guardian Port</label>
                <input type="number" name="guardian_port" id="guardian_port" required
                       placeholder="e.g. 7900" min="1" max="65535">
            </div>
        </div>

        <div class="form-actions">
            <button type="submit" class="btn btn-primary" id="submit-btn">
                Create Policy
            </button>
            <a href="{% url 'index' %}" class="btn">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}

{% block scripts %}
<script src="{% static 'js/policy.js' %}"></script>
{% endblock %}
