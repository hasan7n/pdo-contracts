{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}PDO GUI{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
</head>
<body>
    <nav class="navbar">
        <a href="{% url 'index' %}" class="nav-brand">PDO GUI</a>
        <div class="nav-links">
            <a href="{% url 'sa_create' %}">+ Signature Authority</a>
            <a href="{% url 'policy_create' %}">+ Policy</a>
        </div>
        <div class="nav-user">
            <span class="nav-user-label">Acting as:</span>
            <form method="post" action="{% url 'set_active_user' %}" class="nav-user-form">
                {% csrf_token %}
                <input type="hidden" name="next" value="{{ request.path }}">
                <select name="user_id" class="nav-user-select" onchange="this.form.submit()">
                    <option value="">— select user —</option>
                    {% for u in all_users %}
                        <option value="{{ u.pk }}"{% if active_user and active_user.pk == u.pk %} selected{% endif %}>{{ u.name }}</option>
                    {% endfor %}
                </select>
            </form>
        </div>
    </nav>

    <main class="container">
        {% block content %}{% endblock %}
    </main>

    <div id="loading-overlay" class="loading-overlay hidden">
        <div class="loading-box">
            <div class="spinner"></div>
            <p id="loading-message">Processing… This may take a minute.</p>
        </div>
    </div>

    <div id="toast" class="toast hidden"></div>

    {% block scripts %}{% endblock %}
</body>
</html>
