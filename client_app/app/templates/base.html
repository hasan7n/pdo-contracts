<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}PDO Client{% endblock %}</title>
    <link rel="stylesheet" href="/static/css/styles.css">
</head>
<body>

<nav class="navbar">
    <a href="/" class="nav-brand">PDO Client</a>

    <div class="nav-links">
        <a href="/" {% if request.path == '/' %}class="active"{% endif %}>Assets</a>
        <a href="/wallets/" {% if '/wallets/' in request.path %}class="active"{% endif %}>Wallets</a>
        <a href="/issuers/" {% if '/issuers/' in request.path %}class="active"{% endif %}>Issuers</a>
    </div>

    <div class="nav-right">
        {% if current_identity %}
        <div class="nav-identity">
            <span class="nav-identity-label">Identity:</span>
            <span class="nav-identity-value" title="{{ current_identity }}">{{ current_identity }}</span>
            <button type="button" class="nav-identity-btn"
                    data-modal-open="change-identity-modal">Change</button>
        </div>
        {% else %}
        <button type="button" class="nav-identity-btn"
                data-modal-open="change-identity-modal">Set Identity</button>
        {% endif %}
        <a href="/config/" class="nav-settings-link" title="Settings">&#9881;</a>
    </div>
</nav>

<!-- Change Identity Modal: posts as a regular HTML form -->
<div id="change-identity-modal" class="modal-backdrop hidden">
    <form class="modal" style="max-width:380px" method="post" action="{% url 'identity_set' %}">
        {% csrf_token %}
        <div class="modal-header">
            <span class="modal-title">Change Identity</span>
            <button type="button" class="modal-close"
                    data-modal-close="change-identity-modal">&times;</button>
        </div>
        <div class="form-group">
            <label for="nav-identity-input">Public Key / Username</label>
            <input type="text" id="nav-identity-input" name="public_key"
                   value="{{ current_identity }}" placeholder="e.g. alice" required>
        </div>
        <div class="form-actions">
            <button type="submit" class="btn btn-primary">Save</button>
            <button type="button" class="btn"
                    data-modal-close="change-identity-modal">Cancel</button>
        </div>
    </form>
</div>

{% block content %}{% endblock %}

<script src="/static/js/modals.js"></script>
<script src="/static/js/flash.js"></script>
<script src="/static/js/asset_use.js"></script>
<script src="/static/js/expose.js"></script>
{% block scripts %}{% endblock %}
</body>
</html>
